openapi: 3.0.3
info:
  title: Brother TD-2020A Print Server – API (phase 4)
  version: 0.4.0-dev
  description: |
    Read-only diagnostic API of the phase 2 firmware. Print endpoints
    (/api/print/*, /api/jobs) and API-key authentication follow in phase 5/7.
    Write endpoints are only accepted through the setup access point
    (requests whose local address is 192.168.4.1).
servers:
  - url: http://brother-td2020.local
  - url: http://192.168.4.1
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime_s: { type: integer }
                  printer_ready: { type: boolean }
  /api/status:
    get:
      summary: Firmware, Wi-Fi, memory and printer summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /api/usb:
    get:
      summary: Full USB descriptor report of the attached (or last seen) device
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsbReport' }
  /api/usb/text:
    get:
      summary: Same report as human-readable text (identical to the serial console output)
      responses:
        '200':
          description: OK
          content:
            text/plain: {}
  /api/usb/refresh:
    post:
      summary: Re-run the USB Printer Class requests GET_DEVICE_ID and GET_PORT_STATUS
      description: Read-only towards the printer; returns the updated report.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsbReport' }
        '409':
          description: No device connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /api/printer/status:
    get:
      summary: Brother status request (invalidate, ESC @, ESC i S) and its 32-byte reply
      parameters:
        - name: cached
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: "1 = return the last received status without talking to the printer"
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  printer: { $ref: '#/components/schemas/BrotherStatusEnvelope' }
        '404': { description: cached=1 and no status received yet }
        '409': { description: Printer not connected or a job is running }
        '504': { description: No reply from the printer }
  /api/print/raw:
    post:
      summary: Queue printer-ready data (e.g. produced by the Brother driver); returns immediately
      description: >
        Optional headers: X-Job-Name is shown in the job list; X-Job-Key is an
        idempotency key. A request repeated with a key the queue already knows
        (e.g. after a lost answer) is not queued again - the answer is 200 with
        the existing job and "duplicate": true. Supported when /api/status
        reports print_api.job_key = true (firmware >= 0.4.1).
      parameters:
        - { name: X-Job-Name, in: header, required: false, schema: { type: string, maxLength: 47 } }
        - { name: X-Job-Key, in: header, required: false, schema: { type: string, maxLength: 39 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: X-Job-Key already known - existing job, nothing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResult' }
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResult' }
        '413': { description: Empty or larger than the maximum job size }
        '503': { description: Print queue full }
  /api/printer/settings:
    get:
      summary: Read the settings stored in the printer (documented Brother static commands)
      responses:
        '200': { description: 'settings: [{key, name, value (-1 = no answer), options: [{value, label}]}]' }
        '409': { description: Printer not connected or busy with a job }
    post:
      summary: Write settings, then read all back (firmware >= 0.4.2)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                command_mode: { type: integer, enum: [0, 1, 3], description: '0 ESC/P, 1 Raster, 3 P-touch Template' }
                print_priority: { type: integer, enum: [0, 1], description: '0 speed, 1 quality' }
                rotate: { type: integer, enum: [0, 1] }
                stop_position: { type: integer, enum: [0, 1], description: '0 tear bar, 1 head' }
                recovery: { type: integer, enum: [0, 1] }
      responses:
        '200': { description: Same as GET }
        '400': { description: Unknown setting or invalid value }
        '409': { description: Printer not connected or busy with a job }
  /api/jobs:
    get:
      summary: All jobs (newest first) and queue statistics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    properties:
                      queued: { type: integer }
                      active_id: { type: integer }
                      total_printed: { type: integer }
                      total_failed: { type: integer }
                      spool_bytes: { type: integer }
                      uptime_s: { type: integer }
                  jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
  /api/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: One job
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        '404': { description: Not found }
    delete:
      summary: Cancel a queued or waiting job
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        '404': { description: Not found }
        '409': { description: Job is printing or already finished }
  /api/jobs/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      summary: Queue a failed, unconfirmed or cancelled job again (while its data is kept)
      responses:
        '202': { description: Queued again, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        '404': { description: Not found }
        '409': { description: Not retryable }
  /api/log:
    get:
      summary: Buffered log output (most recent ~32 KiB). Never contains passwords.
      responses:
        '200':
          description: OK
          content:
            text/plain: {}
  /api/wifi:
    post:
      summary: Store Wi-Fi station credentials and connect (setup AP only)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ssid]
              properties:
                ssid: { type: string, minLength: 1, maxLength: 32 }
                password: { type: string, description: empty (open network) or 8-64 characters }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '403': { description: Not connected through the setup AP, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
  /api/system/restart:
    post:
      summary: Restart the device (setup AP only)
      responses:
        '200': { description: Restarting, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '403': { description: Not connected through the setup AP, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
  /api/diag/raw:
    post:
      summary: "DEVELOPMENT: forward a driver-generated print file unchanged to bulk OUT"
      description: |
        Enabled by default; `raw_send off` on the serial console disables it until restart.
        No authentication, no queue. After the transfer the firmware collects the
        printer's own status messages for up to 30 s; `result` is `printed` only if
        the printer reported "printing completed".
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: All bytes acknowledged by the USB device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RawResult' }
        '403': { description: Disabled on the serial console }
        '409': { description: Printer not ready or busy }
        '413': { description: Empty or too large }
        '502':
          description: USB transfer failed or incomplete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RawResult' }
components:
  schemas:
    Job:
      type: object
      properties:
        id: { type: integer }
        state: { type: string, enum: [queued, waiting, printing, printed, failed, unknown, cancelled, incomplete] }
        source: { type: string, enum: [raw9100, http] }
        client: { type: string }
        size: { type: integer }
        created_s: { type: integer, description: uptime seconds }
        started_s: { type: integer }
        finished_s: { type: integer }
        attempts: { type: integer }
        printer_completed: { type: boolean }
        printer_error: { type: boolean }
        can_retry: { type: boolean }
        can_cancel: { type: boolean }
        message: { type: string }
        name: { type: string, description: X-Job-Name of the sender }
        key: { type: string, description: X-Job-Key of the sender; compare it to detect a restarted print server (job ids start at 1 again) }
    JobResult:
      type: object
      properties:
        ok: { type: boolean }
        job_id: { type: integer }
        result: { type: string }
        duplicate: { type: boolean }
        job: { $ref: '#/components/schemas/Job' }
    BrotherStatusEnvelope:
      type: object
      properties:
        age_ms: { type: integer }
        status: { $ref: '#/components/schemas/BrotherStatus' }
    BrotherStatus:
      type: object
      properties:
        model_code: { type: string, example: "3" }
        model: { type: string, example: TD-2020 }
        status_type: { type: string, enum: [reply_to_status_request, printing_completed, error_occurred, exit_if_mode, turned_off, notification, phase_change, unknown] }
        phase: { type: string, enum: [receiving, printing, unknown] }
        phase_number: { type: integer }
        notification: { type: string }
        battery: { type: string }
        media_type: { type: string, enum: [none, continuous_tape, die_cut_labels, unknown] }
        media_width_mm: { type: integer }
        media_length_mm: { type: integer }
        mode: { type: integer }
        error1: { type: integer }
        error2: { type: integer }
        printer_in_use: { type: boolean }
        has_error: { type: boolean }
        errors:
          type: array
          items: { type: string, enum: [no_media, end_of_media, wrong_media, communication_error, cover_open, cannot_feed, system_error] }
        raw: { type: string, description: 32 bytes as hex }
    Message:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
    RawResult:
      type: object
      properties:
        ok: { type: boolean }
        result: { type: string, enum: [printed, sent_no_confirmation, printer_error, transfer_failed] }
        printer_reported_completed: { type: boolean }
        printer_reported_error: { type: boolean }
        printer_messages: { type: array, items: { $ref: '#/components/schemas/BrotherStatus' } }
        bytes_expected: { type: integer }
        bytes_received: { type: integer }
        bytes_acknowledged_by_usb: { type: integer }
        usb_result: { type: string, example: ESP_OK }
    Status:
      type: object
      properties:
        firmware:
          type: object
          properties:
            name: { type: string }
            version: { type: string }
            idf: { type: string }
            build: { type: string }
            phase: { type: string }
        uptime_s: { type: integer }
        reset_reason: { type: string }
        memory:
          type: object
          properties:
            internal_free: { type: integer }
            internal_min_free: { type: integer }
            internal_largest_block: { type: integer }
            psram_free: { type: integer }
            psram_total: { type: integer }
        wifi:
          type: object
          properties:
            sta_configured: { type: boolean }
            sta_connected: { type: boolean }
            ssid: { type: string }
            ip: { type: string }
            gateway: { type: string }
            rssi: { type: integer }
            last_disconnect_reason: { type: integer }
            ap_active: { type: boolean }
            ap_ssid: { type: string }
            ap_ip: { type: string }
            ap_clients: { type: integer }
            hostname: { type: string }
            via_setup_ap: { type: boolean }
        printer:
          type: object
          properties:
            connected: { type: boolean }
            ready: { type: boolean, description: printer interface claimed and bulk OUT available }
            is_printer_class: { type: boolean }
            vid: { type: string, example: '0x04f9' }
            pid: { type: string }
            manufacturer: { type: string }
            product: { type: string }
            connect_count: { type: integer }
            bytes_written_total: { type: integer }
            write_errors_total: { type: integer }
            last_error: { type: string }
        features:
          type: object
          properties:
            raw_send: { type: boolean }
            raw_send_max_bytes: { type: integer }
    UsbReport:
      type: object
      description: All values are taken from the real device. `raw` fields are lowercase hex.
      properties:
        valid: { type: boolean, description: false until a device was enumerated }
        connected: { type: boolean }
        connect_count: { type: integer }
        address: { type: integer }
        speed: { type: string, enum: [low, full, high, unknown] }
        active_configuration: { type: integer }
        device: { type: object, additionalProperties: true }
        strings: { type: object, additionalProperties: true }
        configuration:
          type: object
          additionalProperties: true
          properties:
            raw: { type: string }
            chain_error: { type: string, nullable: true }
            interfaces:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  endpoints: { type: array, items: { type: object, additionalProperties: true } }
                  extra_descriptors: { type: array, items: { type: object, additionalProperties: true } }
        printer_interface: { type: object, additionalProperties: true }
        ieee1284: { type: object, additionalProperties: true }
        port_status: { type: object, additionalProperties: true }
