name: Firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IDF_RELEASE_VERSION: v5.5.6   # firmware that is published (releases + web flasher)

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Descriptor parser tests (ASan/UBSan)
        run: tests/host/run_tests.sh

  build:
    name: Build (ESP-IDF ${{ matrix.idf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.5.6, v6.1]
    container: espressif/idf:${{ matrix.idf }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.2.0-diag-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          FW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build 2>&1 | tee build.log
          # Fail on warnings in this project's own sources (not ESP-IDF / managed components)
          if grep -E "$GITHUB_WORKSPACE/(main|components)/[^ ]*:[0-9]+:[0-9]+: warning:" build.log; then
            echo "::error::compiler warnings in project sources"
            exit 1
          fi
          idf.py merge-bin
          idf.py size

      - name: Package
        if: matrix.idf == env.IDF_RELEASE_VERSION
        shell: bash
        run: python3 tools/package_firmware.py build dist "${{ steps.ver.outputs.version }}"

      - name: Upload firmware
        if: matrix.idf == env.IDF_RELEASE_VERSION
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error

  pages:
    name: Publish web flasher (GitHub Pages)
    needs: [host-tests, build]
    # The github-pages environment only accepts deployments from the default branch.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Assemble site
        run: |
          mkdir -p site
          cp flasher/index.html site/
          cp dist/* site/
          touch site/.nojekyll
          ls -la site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: GitHub release
    needs: [host-tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ESP32-S3 (N16R8) firmware, built with ESP-IDF ${{ env.IDF_RELEASE_VERSION }}.

            **Browser flasher:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            Manual flashing (UART/COM port):
            ```
            python -m esptool --chip esp32s3 -p <PORT> -b 460800 write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x19000 ota_data_initial.bin 0x20000 brother_printserver.bin
            ```
            The `*-merged.bin` image goes to offset 0x0 but also erases the NVS (Wi-Fi settings).
